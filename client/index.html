<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forever Learning</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- HTML overlay for uploading notes (shown by UploadScene) -->
    <form id="upload-panel" class="overlay" hidden>
      <h2>Before class starts…</h2>
      <p>Hand in your notes so I can prepare your lessons! ★</p>
      <label>
        Your name
        <input id="player-name" type="text" maxlength="24" placeholder="Student" />
      </label>
      <label class="file-drop">
        <input id="notes-input" type="file" multiple accept=".pdf,.txt,.md,image/*" />
        <span id="file-label">Choose PDFs, photos of notes, or .txt files</span>
      </label>
      <button type="submit" id="upload-btn">Start class</button>
      <p id="upload-status" class="status"></p>
    </form>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
